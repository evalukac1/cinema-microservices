spring.cloud.gateway.server.webflux.routes[1].uri=lb://screening-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/halls,/api/halls/**,/api/screenings,/api/screenings/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
