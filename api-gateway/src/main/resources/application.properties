spring.application.name=api-gateway
server.port=8080

management.endpoints.web.exposure.include=health,info

spring.cloud.config.enabled=${CONFIG_ENABLED:false}
spring.config.import=${CONFIG_IMPORT:}

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.routes[0].id=movie-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://movie-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/movies,/api/movies/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=movies
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/unavailable
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statusCodes=500,502,503,504

