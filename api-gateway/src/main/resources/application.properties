spring.application.name=api-gateway
server.port=8080

management.endpoints.web.exposure.include=health,info

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=20s

spring.cloud.gateway.server.webflux.routes[0].id=movie-service
spring.cloud.gateway.server.webflux.routes[0].uri=${MOVIE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/movies,/api/movies/**

spring.cloud.gateway.server.webflux.routes[1].id=screening-service
spring.cloud.gateway.server.webflux.routes[1].uri=${SCREENING_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/halls,/api/halls/**,/api/screenings,/api/screenings/**

spring.cloud.gateway.server.webflux.routes[2].id=seat-inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=${INVENTORY_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webflux.routes[3].id=reservation-service
spring.cloud.gateway.server.webflux.routes[3].uri=${RESERVATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/reservations,/api/reservations/**

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=${PAYMENT_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**