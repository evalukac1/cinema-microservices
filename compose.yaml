name: cinema

services:
  movie-db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: movie_db
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_local_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - movie-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  movie-db-data: