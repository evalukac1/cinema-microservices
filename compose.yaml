name: cinema

services:
  movie-db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: movie_db
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_local_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - movie-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  movie-service:
    build:
      context: ./movie-service
    image: cinema/movie-service:local
    environment:
      SERVER_PORT: "8081"
      MOVIE_DB_URL: jdbc:postgresql://movie-db:5432/movie_db
      MOVIE_DB_USERNAME: movie_user
      MOVIE_DB_PASSWORD: movie_local_password
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      movie-db:
        condition: service_healthy

  screening-db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: screening_db
      POSTGRES_USER: screening_user
      POSTGRES_PASSWORD: screening_local_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - screening-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screening_user -d screening_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  screening-service:
    build:
      context: ./screening-service
    image: cinema/screening-service:local
    environment:
      SERVER_PORT: "8082"
      SCREENING_DB_URL: jdbc:postgresql://screening-db:5432/screening_db
      SCREENING_DB_USERNAME: screening_user
      SCREENING_DB_PASSWORD: screening_local_password
      MOVIE_SERVICE_URL: http://movie-service:8081
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      screening-db:
        condition: service_healthy
      movie-service:
        condition: service_started

  inventory-db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_local_password
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seat-inventory-service:
    build:
      context: ./seat-inventory-service
    image: cinema/seat-inventory-service:local
    environment:
      SERVER_PORT: "8083"
      INVENTORY_DB_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      INVENTORY_DB_USERNAME: inventory_user
      INVENTORY_DB_PASSWORD: inventory_local_password
      SCREENING_SERVICE_URL: http://screening-service:8082
      INVENTORY_HOLD_DURATION: PT10M
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      inventory-db:
        condition: service_healthy
      screening-service:
        condition: service_started

  reservation-db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: reservation_db
      POSTGRES_USER: reservation_user
      POSTGRES_PASSWORD: reservation_local_password
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation_user -d reservation_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: cinema
      RABBITMQ_DEFAULT_PASS: cinema_local_password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  reservation-service:
    build:
      context: ./reservation-service
    image: cinema/reservation-service:local
    environment:
      SERVER_PORT: "8084"
      RESERVATION_DB_URL: jdbc:postgresql://reservation-db:5432/reservation_db
      RESERVATION_DB_USERNAME: reservation_user
      RESERVATION_DB_PASSWORD: reservation_local_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: cinema
      RABBITMQ_PASSWORD: cinema_local_password
      SCREENING_SERVICE_URL: http://screening-service:8082
      INVENTORY_SERVICE_URL: http://seat-inventory-service:8083
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      reservation-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      screening-service:
        condition: service_started
      seat-inventory-service:
        condition: service_started

  payment-db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_local_password
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  payment-service:
    build:
      context: ./payment-service
    image: cinema/payment-service:local
    environment:
      SERVER_PORT: "8085"
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      PAYMENT_DB_USERNAME: payment_user
      PAYMENT_DB_PASSWORD: payment_local_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: cinema
      RABBITMQ_PASSWORD: cinema_local_password
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    image: cinema/api-gateway:local
    environment:
      SERVER_PORT: "8080"
      MOVIE_SERVICE_URL: http://movie-service:8081
      SCREENING_SERVICE_URL: http://screening-service:8082
      INVENTORY_SERVICE_URL: http://seat-inventory-service:8083
      RESERVATION_SERVICE_URL: http://reservation-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      movie-service:
        condition: service_started
      screening-service:
        condition: service_started
      seat-inventory-service:
        condition: service_started
      reservation-service:
        condition: service_started
      payment-service:
        condition: service_started

volumes:
  movie-db-data:
  screening-db-data:
  inventory-db-data:
  reservation-db-data:
  rabbitmq-data:
  payment-db-data: